<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant 3D Experience</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #canvas3d { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .content { position: relative; z-index: 10; color: white; font-family: sans-serif; text-align: center; top: 20%; pointer-events: none; }
        h1 { font-size: 4rem; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div class="content">
        <h1>Royal Feast</h1>
        <p>Experience food like never before</p>
    </div>

    <!-- Spline Viewer Script will go below -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.48/build/spline-viewer.js"></script>
    
    <!-- Replace the below 태그 with your actual Spline export embed code -->
    <spline-viewer id="canvas3d" url="https://prod.spline.design/your-scene-url-here/scene.splinecode"></spline-viewer>

</body>
</html>
